<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado pelo seu cadastro</title>
  <style>
    body {
      background: #f0fff4;
      font-family: Arial, sans-serif;
      color: #1b4332;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    h1 {
      color: #2d6a4f;
    }
    p {
      margin-top: 10px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #ffffff;
      background: #2d6a4f;
      padding: 10px 20px;
      border-radius: 8px;
    }
    a:hover {
      background: #40916c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Obrigado por se cadastrar!</h1>
    <p>Em até 24 horas, um de nossos representantes financeiros irá entrar em contato via WhatsApp.</p>
    <a href="index.html">Voltar ao início</a>
  </div>
</body>
</html>
